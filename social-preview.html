<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #16325E 0%, #0A1426 100%);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .icon-chip {
    width: 460px; height: 460px;
    border-radius: 96px;
    background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .icon-chip img {
    width: 380px; height: 380px;
    object-fit: contain;
  }
  .title {
    margin-top: 34px;
    color: #FFFFFF; font-size: 44px; font-weight: 700; letter-spacing: 0.04em;
    text-align: center; line-height: 1.2;
  }
  .title .en { display: block; font-size: 24px; font-weight: 600; opacity: 0.6; letter-spacing: 0.14em; margin-top: 4px; }
  .tag {
    margin-top: 18px;
    padding: 8px 24px; border-radius: 999px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
    font-size: 17px; letter-spacing: 0.05em; color: #C7D8F5;
  }
</style>
</head>
<body>
  <div class="icon-chip">
    <img src="icon.png" alt="icon"/>
  </div>
  <div class="title">泰山识图<span class="en">TAISHAN VISION</span></div>
  <div class="tag">让纯文本模型也能看图 · GLM 免费识图</div>
</body>
</html>
