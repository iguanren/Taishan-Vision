name: 💡 功能建议
description: 为泰山识图提出新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法!描述清楚使用场景能帮助我们更好地理解需求。

  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 你想解决什么场景下的什么问题?
      placeholder: |
        例如:希望支持更多视觉模型提供方…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望怎么实现?可以是界面、行为或命令
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法?
